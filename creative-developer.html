<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sameera Chathuranga | Creative Developer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <!-- Google Fonts: Inter & Syne -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0b0b0e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .font-syne {
            font-family: 'Syne', sans-serif;
        }

        /* Ambient Glow Animations */
        @keyframes pulseGlow1 {
            0%, 100% {
                transform: translate(-50%, -30%) scale(1);
                opacity: 0.75;
            }
            50% {
                transform: translate(-50%, -24%) scale(1.15);
                opacity: 0.95;
            }
        }

        @keyframes pulseGlow2 {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(30px, -25px) scale(1.2);
                opacity: 0.85;
            }
        }

        @keyframes pulseGlow3 {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.55;
            }
            50% {
                transform: translate(-25px, 25px) scale(1.15);
                opacity: 0.8;
            }
        }

        .ambient-orb {
            position: absolute;
            border-radius: 9999px;
            filter: blur(130px);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .ambient-center {
            width: 760px;
            height: 760px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.28) 0%, rgba(139, 92, 246, 0.14) 45%, transparent 70%);
            top: 25%;
            left: 45%;
            transform: translate(-50%, -30%);
            animation: pulseGlow1 9s ease-in-out infinite alternate;
        }

        .ambient-cyan {
            width: 620px;
            height: 620px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.22) 0%, rgba(14, 165, 233, 0.1) 45%, transparent 70%);
            bottom: 5%;
            left: 5%;
            animation: pulseGlow2 11s ease-in-out infinite alternate;
        }

        .ambient-rose {
            width: 580px;
            height: 580px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, rgba(217, 70, 239, 0.1) 45%, transparent 70%);
            top: 15%;
            right: 8%;
            animation: pulseGlow3 10s ease-in-out infinite alternate;
        }

        /* Subtle Cyber Dot Grid */
        .cyber-grid {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(circle at 50% 50%, #000 50%, transparent 95%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 50%, transparent 95%);
            pointer-events: none;
            opacity: 0.75;
        }

        /* Center-Left Portrait Blending (#cvimage + #avatar2) with Radial Vignettes */
        .cvimage-wrapper {
            position: absolute;
            top: 50%;
            left: 45%; /* Shifted towards left side as requested */
            transform: translate(-50%, -48%);
            width: 90vw;
            max-width: 860px; /* Noticeably larger image as requested */
            height: 90vh;
            max-height: 940px;
            pointer-events: auto; /* Active for hover & cursor interaction */
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* Top Layer: Suit Portrait */
        .cvimage-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 16%;
            z-index: 3;
            filter: contrast(1.08) brightness(0.92) saturate(0.96) url(#liquidWaterFilter);
            -webkit-mask-image: radial-gradient(ellipse 70% 68% at 50% 46%, #000 35%, rgba(0, 0, 0, 0.88) 56%, rgba(0, 0, 0, 0.2) 78%, transparent 100%);
            mask-image: radial-gradient(ellipse 70% 68% at 50% 46%, #000 35%, rgba(0, 0, 0, 0.88) 56%, rgba(0, 0, 0, 0.2) 78%, transparent 100%);
            opacity: 1;
            transform: translateY(0px) scale(1);
            transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease;
            will-change: transform, opacity;
        }

        /* Underneath Layer: 2nd Image (3D Character Avatar) */
        .avatar2-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            opacity: 0;
            transform: translateY(32px) scale(0.93);
            transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease;
            will-change: transform, opacity;
            pointer-events: none;
        }

        .avatar2-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            filter: contrast(1.12) brightness(1.02) saturate(1.08);
            -webkit-mask-image: radial-gradient(ellipse 56% 62% at 50% 46%, #000 35%, rgba(0, 0, 0, 0.85) 58%, transparent 78%);
            mask-image: radial-gradient(ellipse 56% 62% at 50% 46%, #000 35%, rgba(0, 0, 0, 0.85) 58%, transparent 78%);
        }

        .avatar2-ambient-glow {
            position: absolute;
            inset: 15%;
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(217, 70, 239, 0.28) 0%, rgba(6, 182, 212, 0.2) 40%, transparent 70%);
            filter: blur(50px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.65s ease;
        }

        /* Hover States: 2nd image emerges from underneath! */
        .cvimage-wrapper:hover .avatar2-layer,
        .cvimage-wrapper.is-revealed .avatar2-layer {
            opacity: 1 !important;
            filter: drop-shadow(0 0 50px rgba(6, 182, 212, 0.45));
        }

        .cvimage-wrapper:hover .avatar2-ambient-glow,
        .cvimage-wrapper.is-revealed .avatar2-ambient-glow {
            opacity: 1 !important;
        }

        .cvimage-wrapper:hover .cvimage-img,
        .cvimage-wrapper.is-revealed .cvimage-img {
            opacity: 0 !important;
            transform: translateY(-24px) scale(1.05) !important;
            pointer-events: none;
        }

        /* Vignettes over both images for seamless #0b0b0e edge blending */
        .cvimage-fade-bottom {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #0b0b0e 12%, rgba(11, 11, 14, 0.92) 32%, rgba(11, 11, 14, 0.25) 58%, transparent 80%);
            pointer-events: none;
            z-index: 4;
        }

        .cvimage-fade-top {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, #0b0b0e 0%, rgba(11, 11, 14, 0.7) 16%, transparent 40%);
            pointer-events: none;
            z-index: 4;
        }

        .cvimage-fade-sides {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 50%, transparent 34%, rgba(11, 11, 14, 0.75) 60%, #0b0b0e 88%);
            pointer-events: none;
            z-index: 4;
        }

        /* Subtle interactive pill hint attached to portrait */
        .avatar-hover-pill {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 9999px;
            background: rgba(18, 18, 24, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.75);
            font-size: 11px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            transition: all 0.4s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .avatar-hover-dot {
            width: 7px;
            height: 7px;
            border-radius: 9999px;
            background-color: #22d3ee;
            box-shadow: 0 0 10px #22d3ee;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .cvimage-wrapper:hover .avatar-hover-pill,
        .cvimage-wrapper.is-revealed .avatar-hover-pill {
            background: rgba(6, 182, 212, 0.15);
            border-color: rgba(34, 211, 238, 0.4);
            color: #ffffff;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.45);
            transform: translateX(-50%) translateY(-4px);
        }

        .cvimage-wrapper:hover .avatar-hover-dot,
        .cvimage-wrapper.is-revealed .avatar-hover-dot {
            background-color: #ec4899;
            box-shadow: 0 0 14px #ec4899;
        }

        /* Primary "LET'S GO" Pulsing Glow Button */
        @keyframes pulseLetsGo {
            0%, 100% {
                box-shadow: 0 0 35px rgba(168, 85, 247, 0.6), 0 0 65px rgba(6, 182, 212, 0.4);
            }
            50% {
                box-shadow: 0 0 55px rgba(168, 85, 247, 0.9), 0 0 95px rgba(6, 182, 212, 0.6);
            }
        }

        .btn-lets-go-glow {
            animation: pulseLetsGo 2.4s ease-in-out infinite;
        }

        /* ======================================================== */
        /* 4 GLASS PANELS CINEMATIC TRANSITION                      */
        /* ======================================================== */
        .glass-transition-overlay {
            pointer-events: none;
            z-index: 100000;
        }

        .glass-transition-overlay.active {
            pointer-events: auto;
        }

        .glass-column {
            position: relative;
            width: 25%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(18, 18, 26, 0.84) 0%,
                rgba(11, 11, 17, 0.9) 50%,
                rgba(6, 6, 9, 0.96) 100%
            );
            backdrop-filter: blur(36px) saturate(190%);
            -webkit-backdrop-filter: blur(36px) saturate(190%);
            border-right: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 0 60px rgba(255, 255, 255, 0.03), 0 0 50px rgba(0, 0, 0, 0.85);
            will-change: transform;
            transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-column:last-child {
            border-right: none;
        }

        /* Glass Reflection Sheen */
        .glass-reflection {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                115deg,
                rgba(255, 255, 255, 0.09) 0%,
                rgba(255, 255, 255, 0.02) 28%,
                transparent 55%,
                rgba(34, 211, 238, 0.05) 100%
            );
            pointer-events: none;
        }

        /* Glowing Neon Cyan/Purple Edge Accents */
        .glass-edge-line {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            width: 1.5px;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(34, 211, 238, 0.6) 30%,
                rgba(168, 85, 247, 0.7) 70%,
                transparent 100%
            );
            pointer-events: none;
        }

        /* Initial Idle State: Panels hidden outside the viewport */
        .glass-col-1 { transform: translateY(-105%); } /* Slides from Top */
        .glass-col-2 { transform: translateY(105%); }  /* Slides from Bottom */
        .glass-col-3 { transform: translateY(-105%); } /* Slides from Top */
        .glass-col-4 { transform: translateY(105%); }  /* Slides from Bottom */

        /* Incoming / Closed State: All 4 Glass Panels Cover the Screen */
        .glass-transition-overlay.closing .glass-col-1 { transform: translateY(0%); transition-delay: 0.00s; }
        .glass-transition-overlay.closing .glass-col-2 { transform: translateY(0%); transition-delay: 0.08s; }
        .glass-transition-overlay.closing .glass-col-3 { transform: translateY(0%); transition-delay: 0.16s; }
        .glass-transition-overlay.closing .glass-col-4 { transform: translateY(0%); transition-delay: 0.24s; }

        /* Outgoing / Beautiful Removal State ("eka lassnata remove wenna one") */
        .glass-transition-overlay.opening .glass-col-1 { transform: translateY(-105%); transition-delay: 0.00s; }
        .glass-transition-overlay.opening .glass-col-2 { transform: translateY(105%);  transition-delay: 0.08s; }
        .glass-transition-overlay.opening .glass-col-3 { transform: translateY(-105%); transition-delay: 0.16s; }
        .glass-transition-overlay.opening .glass-col-4 { transform: translateY(105%);  transition-delay: 0.24s; }

        /* Center HUD Animation */
        .glass-center-hud {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.9);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .glass-center-hud.show {
            opacity: 1 !important;
            transform: translate(-50%, -50%) scale(1) !important;
        }

        .glass-center-hud.completed {
            opacity: 0 !important;
            transform: translate(-50%, -50%) scale(1.15) !important;
            transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>

<body class="bg-[#0b0b0e] h-screen w-screen relative flex items-center justify-start overflow-hidden select-none">

    <!-- SVG Liquid Water Ripple Filter -->
    <svg class="hidden" aria-hidden="true">
        <defs>
            <filter id="liquidWaterFilter" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence id="waterTurbulence" type="fractalNoise" baseFrequency="0.015 0.02" numOctaves="2" result="noise" />
                <feDisplacementMap id="waterDisplacement" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <!-- Interactive Water Ripple Canvas -->
    <canvas id="waterCanvas"></canvas>

    <!-- 4 GLASS PANELS CINEMATIC TRANSITION OVERLAY -->
    <div id="glassTransitionOverlay" class="glass-transition-overlay fixed inset-0 flex w-full h-full overflow-hidden select-none pointer-events-none" aria-hidden="true">
        <!-- 4 Frosted Glass Columns (Glass 4) -->
        <div class="glass-column glass-col-1" id="glassCol1">
            <div class="glass-reflection"></div>
            <div class="glass-edge-line"></div>
        </div>
        <div class="glass-column glass-col-2" id="glassCol2">
            <div class="glass-reflection"></div>
            <div class="glass-edge-line"></div>
        </div>
        <div class="glass-column glass-col-3" id="glassCol3">
            <div class="glass-reflection"></div>
            <div class="glass-edge-line"></div>
        </div>
        <div class="glass-column glass-col-4" id="glassCol4">
            <div class="glass-reflection"></div>
            <div class="glass-edge-line"></div>
        </div>

        <!-- Center 0% to 100% Counter HUD -->
        <div id="glassCenterHUD" class="glass-center-hud fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[100010] flex flex-col items-center justify-center">
            <!-- Glowing Circular Progress Ring & Hologram Frame -->
            <div class="relative flex items-center justify-center w-52 h-52 sm:w-64 sm:h-64">
                <!-- Pulsing ambient backdrop halo -->
                <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-cyan-500/25 via-indigo-600/20 to-purple-600/30 blur-2xl animate-pulse"></div>

                <!-- Circular Progress Ring SVG -->
                <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 160 160">
                    <circle cx="80" cy="80" r="68" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" fill="none" />
                    <circle id="glassProgressCircle" cx="80" cy="80" r="68"
                        stroke="url(#glassGradProgress)" stroke-width="5" stroke-linecap="round" fill="none"
                        stroke-dasharray="427" stroke-dashoffset="427"
                        style="filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.8)); will-change: stroke-dashoffset;" />
                    <defs>
                        <linearGradient id="glassGradProgress" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#22d3ee" />
                            <stop offset="50%" stop-color="#818cf8" />
                            <stop offset="100%" stop-color="#c084fc" />
                        </linearGradient>
                    </defs>
                </svg>

                <!-- Center Digital Counter Display -->
                <div class="relative z-10 flex flex-col items-center justify-center text-center">
                    <span id="glassPercentText" class="font-syne font-black text-5xl sm:text-6xl tracking-tight text-transparent bg-clip-text bg-gradient-to-br from-white via-cyan-100 to-cyan-400 drop-shadow-[0_0_25px_rgba(6,182,212,0.7)] select-none">
                        0%
                    </span>
                    <span id="glassStatusLabel" class="text-[10px] sm:text-[11px] font-mono tracking-[0.28em] uppercase text-cyan-300/80 mt-2">
                        INITIALIZING
                    </span>
                </div>
            </div>

            <!-- Sleek Horizontal Pill Progress Bar -->
            <div class="w-48 sm:w-56 h-1.5 bg-white/10 rounded-full mt-4 overflow-hidden border border-white/10 backdrop-blur-md">
                <div id="glassProgressBar" class="h-full w-0 bg-gradient-to-r from-cyan-400 via-indigo-500 to-purple-500 rounded-full shadow-[0_0_15px_rgba(34,211,238,0.8)]"></div>
            </div>

            <!-- Audio & studio pill -->
            <div class="mt-3 inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-black/50 border border-white/10 backdrop-blur-md text-[10px] font-mono text-zinc-400 tracking-wider">
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span>
                <span>ENTERING NEXTGEN WEB STUDIO</span>
            </div>
        </div>
    </div>

    <!-- Ambient Glow Effects & Mesh Grid -->
    <div class="cyber-grid"></div>
    <div class="ambient-orb ambient-center"></div>
    <div class="ambient-orb ambient-cyan"></div>
    <div class="ambient-orb ambient-rose"></div>
    <div id="mouseSpotlight" class="pointer-events-none absolute -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full bg-gradient-to-r from-indigo-500/10 via-cyan-500/10 to-transparent blur-[100px] opacity-0 md:opacity-100 transition-opacity duration-500"></div>

    <!-- BACKGROUND & IMAGE: Large Portrait with 2nd Image Emerging on Hover -->
    <div id="portraitWrapper" class="cvimage-wrapper group" role="region" aria-label="Interactive Developer Portrait">
        <!-- UNDERNEATH LAYER: 2nd Image (3D Character Avatar) -->

            <img id="avatar2" src="avatar2.webp" alt="Sameera 3D Character Avatar"

                onerror="this.onerror=null; this.src='avatar2.png';" />
            <div class="avatar2-ambient-glow"></div>

        <!-- TOP LAYER: 1st Image (Sameera Suit Portrait) -->

        <!-- Smooth Vignette Layers Blending Seamlessly into #0b0b0e -->
        <div class="cvimage-fade-bottom"></div>
        <div class="cvimage-fade-top"></div>
        <div class="cvimage-fade-sides"></div>

        <!-- Subtle interactive pill hint attached to portrait -->
        <div class="avatar-hover-pill">
            <span class="avatar-hover-dot"></span>

    <!-- MAIN VIEWPORT CONTENT (Left Anchored Hero with LET'S GO Button in Purple Box Position) -->
    <main class="w-full max-w-7xl mx-auto px-6 sm:px-12 lg:px-16 relative z-20 flex flex-col justify-center pointer-events-none">
        <div class="w-full max-w-3xl flex flex-col items-start text-left pointer-events-none">
            
            <!-- Subtitle Badge: "HI, I'M SAMEERA CHATHURANGA" -->
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/5 border border-white/10 backdrop-blur-md text-[11px] sm:text-xs font-bold tracking-[0.26em] text-cyan-300 uppercase mb-4 shadow-lg shadow-black/40 pointer-events-auto">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                <span>HI, I'M SAMEERA CHATHURANGA</span>
            </div>

            <!-- Huge Headline: "CREATIVE DEVELOPER" with gradient text effect -->
            <h1 class="font-syne font-black uppercase tracking-tight text-4xl sm:text-6xl md:text-7xl lg:text-[5.5rem] xl:text-[6.5rem] leading-[0.9] mb-4 select-none">
                <span class="block bg-clip-text text-transparent bg-gradient-to-r from-white via-zinc-100 to-zinc-400 drop-shadow-[0_6px_32px_rgba(255,255,255,0.18)]">CREATIVE</span>

                <span class="px-3 py-1 rounded-full bg-white/5 border border-white/10 text-zinc-300">AI &amp; Interactive 3D</span>

            <!-- THE REQUESTED "LET'S GO ↗" PRIMARY ACTION BUTTON (In Purple Box Position) -->
            <div class="flex flex-col items-start gap-3 pointer-events-auto">
                <a href="INDEX.HTML" id="btnLetsGo" aria-label="Enter Website and Start Music"
                    class="btn-lets-go-glow group relative px-10 sm:px-14 py-4 sm:py-5 rounded-full bg-gradient-to-r from-cyan-500 via-indigo-600 to-purple-600 text-white font-syne font-extrabold text-sm sm:text-base tracking-[0.26em] uppercase transition-all duration-300 hover:scale-105 active:scale-95 flex items-center justify-center gap-3 cursor-pointer select-none shadow-[0_0_40px_rgba(147,51,234,0.55)] hover:shadow-[0_0_65px_rgba(6,182,212,0.85)]">
                    <span class="w-2.5 h-2.5 rounded-full bg-white animate-ping"></span>

                <p class="text-[11px] text-zinc-400 font-mono tracking-wider flex items-center gap-2 pl-2">

    <!-- Interactive Water Ripple Simulation & Liquid Surface Motion Script -->
    <script>
        // 1. Water Ripple Canvas Simulation Engine
        const waterCanvas = document.getElementById('waterCanvas');
        const ctx = waterCanvas.getContext('2d');
        let width = (waterCanvas.width = window.innerWidth);
        let height = (waterCanvas.height = window.innerHeight);

        window.addEventListener('resize', () => {
            width = waterCanvas.width = window.innerWidth;
            height = waterCanvas.height = window.innerHeight;
        }, { passive: true });

        const ripples = [];

        class WaterRipple {
            constructor(x, y, radius = 5, strength = 1, color = 'cyan') {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.maxRadius = Math.random() * 85 + 75;
                this.alpha = strength * 0.75;
                this.speed = Math.random() * 1.6 + 2.2;
                this.color = color;
            }
            update() {
                this.radius += this.speed;
                this.alpha *= 0.965;
                return this.alpha > 0.015;
            }
            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                const grad = ctx.createRadialGradient(
                    this.x, this.y, Math.max(0, this.radius - 8),
                    this.x, this.y, this.radius + 6
                );
                if (this.color === 'cyan') {
                    grad.addColorStop(0, 'rgba(6, 182, 212, 0)');
                    grad.addColorStop(0.5, `rgba(34, 211, 238, ${this.alpha * 0.65})`);
                    grad.addColorStop(0.85, `rgba(165, 243, 252, ${this.alpha * 0.9})`);
                    grad.addColorStop(1, 'rgba(6, 182, 212, 0)');
                } else {
                    grad.addColorStop(0, 'rgba(168, 85, 247, 0)');
                    grad.addColorStop(0.5, `rgba(192, 132, 252, ${this.alpha * 0.65})`);
                    grad.addColorStop(0.85, `rgba(233, 213, 255, ${this.alpha * 0.9})`);
                    grad.addColorStop(1, 'rgba(168, 85, 247, 0)');
                }
                ctx.strokeStyle = grad;
                ctx.lineWidth = Math.max(1, 4.5 * (1 - this.radius / this.maxRadius));
                ctx.stroke();

                // Inner refraction ring
                if (this.radius > 16) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 0.65, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(147, 197, 253, ${this.alpha * 0.35})`;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        // Add water ripple and dynamic portrait interactive states
        let lastX = 0, lastY = 0;
        let lastTime = 0;
        const waterDisplacement = document.getElementById('waterDisplacement');
        const waterTurbulence = document.getElementById('waterTurbulence');
        const mouseSpotlight = document.getElementById('mouseSpotlight');
        const portraitWrapper = document.getElementById('portraitWrapper');
        const cvimage = document.getElementById('cvimage');
        const avatar2Layer = document.getElementById('avatar2Layer');
        const avatarHoverLabel = document.querySelector('.avatar-hover-label');

        let currentDisplacementScale = 0;
        let targetDisplacementScale = 0;
        let turbPhase = 0;
        let isHoveringPortrait = false;

        function addWaterDrop(x, y, strength = 1) {
            const color = Math.random() > 0.4 ? 'cyan' : 'purple';
            ripples.push(new WaterRipple(x, y, 4, strength, color));
            if (ripples.length > 50) ripples.shift();
        }

        // Portrait hover interaction: 2nd Image emerges from underneath
        if (portraitWrapper) {
            portraitWrapper.addEventListener('mouseenter', () => {
                isHoveringPortrait = true;
                portraitWrapper.classList.add('is-revealed');
                if (avatarHoverLabel) avatarHoverLabel.textContent = '3D Avatar Active ✦';
                targetDisplacementScale = 28;
                addWaterDrop(window.innerWidth * 0.45, window.innerHeight * 0.48, 2.2);
            });

            portraitWrapper.addEventListener('mouseleave', () => {
                isHoveringPortrait = false;
                portraitWrapper.classList.remove('is-revealed');
                if (avatarHoverLabel) avatarHoverLabel.textContent = 'Hover to reveal 3D Avatar';
                targetDisplacementScale = 14;
                if (cvimage) cvimage.style.transform = '';
                if (avatar2Layer) avatar2Layer.style.transform = '';
            });

            portraitWrapper.addEventListener('click', () => {
                portraitWrapper.classList.toggle('is-revealed');
                const revealed = portraitWrapper.classList.contains('is-revealed');
                if (avatarHoverLabel) {
                    avatarHoverLabel.textContent = revealed ? '3D Avatar Active ✦' : 'Hover to reveal 3D Avatar';
                }
                targetDisplacementScale = 30;
                addWaterDrop(window.innerWidth * 0.45, window.innerHeight * 0.48, 2.4);
            });
        }

        window.addEventListener('mousemove', (e) => {
            const now = performance.now();
            const dt = now - lastTime;
            lastTime = now;

            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            const dist = Math.hypot(dx, dy);
            const speed = dt > 0 ? dist / dt : 0;

            lastX = e.clientX;
            lastY = e.clientY;

            // Trigger water ripples when moving mouse
            if (dist > 14) {
                const strength = Math.min(1.8, Math.max(0.6, speed * 0.8));
                addWaterDrop(e.clientX, e.clientY, strength);
                targetDisplacementScale = Math.min(24, speed * 4);
            }

            if (mouseSpotlight) {
                mouseSpotlight.style.left = e.clientX + 'px';
                mouseSpotlight.style.top = e.clientY + 'px';
            }

            // Interactive 3D Parallax Depth on mouse movement ("mama mause eka ehema mehata karaddi")
            if (portraitWrapper && window.innerWidth >= 1024) {
                const rect = portraitWrapper.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const mx = (e.clientX - centerX) / (rect.width / 2);
                const my = (e.clientY - centerY) / (rect.height / 2);

                const isInsidePortrait = Math.abs(mx) <= 1.05 && Math.abs(my) <= 1.05;
                if (isInsidePortrait) {
                    if (!portraitWrapper.classList.contains('is-revealed')) {
                        portraitWrapper.classList.add('is-revealed');
                        if (avatarHoverLabel) avatarHoverLabel.textContent = '3D Avatar Active ✦';
                        targetDisplacementScale = 28;
                        addWaterDrop(e.clientX, e.clientY, 1.8);
                    }
                } else if (!isHoveringPortrait) {
                    if (portraitWrapper.classList.contains('is-revealed')) {
                        portraitWrapper.classList.remove('is-revealed');
                        if (avatarHoverLabel) avatarHoverLabel.textContent = 'Hover to reveal 3D Avatar';
                    }
                }

                if (portraitWrapper.classList.contains('is-revealed')) {
                    // Underneath 2nd Image tracks cursor with 3D tilt and elevation
                    if (avatar2Layer) {
                        avatar2Layer.style.transform = `translate3d(${mx * 16}px, ${my * 12}px, 0) scale(1.03) rotateY(${mx * 6}deg) rotateX(${-my * 5}deg)`;
                    }
                } else {
                    // Top Suit Image tracks subtly
                    if (cvimage) {
                        cvimage.style.transform = `translate3d(${mx * 10}px, ${my * 8}px, 0) scale(1.01)`;
                    }
                }
            }
        }, { passive: true });

        // Click on water to make a big ripple splash
        window.addEventListener('click', (e) => {
            if (e.target.closest('#btnLetsGo')) return;
            addWaterDrop(e.clientX, e.clientY, 2.2);
            targetDisplacementScale = 25;
        });

        // Animation loop for water waves & liquid distortion
        function animateWater() {
            ctx.clearRect(0, 0, width, height);

            for (let i = ripples.length - 1; i >= 0; i--) {
                const alive = ripples[i].update();
                if (alive) {
                    ripples[i].draw(ctx);
                } else {
                    ripples.splice(i, 1);
                }
            }

            // Liquid SVG displacement decay and water motion
            currentDisplacementScale += (targetDisplacementScale - currentDisplacementScale) * 0.08;
            targetDisplacementScale *= 0.94; // fade out distortion smoothly
            turbPhase += 0.006;

            if (waterDisplacement) {
                waterDisplacement.setAttribute('scale', currentDisplacementScale.toFixed(2));
            }
            if (waterTurbulence) {
                const fx = 0.015 + Math.sin(turbPhase) * 0.003;
                const fy = 0.02 + Math.cos(turbPhase) * 0.003;
                waterTurbulence.setAttribute('baseFrequency', `${fx} ${fy}`);
            }

            requestAnimationFrame(animateWater);
        }
        animateWater();

        // ========================================================
        // 4 GLASS PANELS + 0% TO 100% TRANSITION CONTROLLER
        // ========================================================
        const btnLetsGo = document.getElementById('btnLetsGo');
        const glassTransitionOverlay = document.getElementById('glassTransitionOverlay');
        const glassCenterHUD = document.getElementById('glassCenterHUD');
        const glassPercentText = document.getElementById('glassPercentText');
        const glassStatusLabel = document.getElementById('glassStatusLabel');
        const glassProgressCircle = document.getElementById('glassProgressCircle');
        const glassProgressBar = document.getElementById('glassProgressBar');

        let isTransitioning = false;

        function runGlassTransition(onComplete) {
            if (isTransitioning) return;
            isTransitioning = true;

            // 1. Activate overlay and slide the 4 glass panels in
            glassTransitionOverlay.classList.remove('opening');
            glassTransitionOverlay.classList.add('active', 'closing');

            // 2. Show center HUD
            setTimeout(() => {
                glassCenterHUD.classList.remove('completed');
                glassCenterHUD.classList.add('show');
            }, 300);

            // 3. Smooth 0% to 100% digital counter
            const duration = 1500;
            const startTime = performance.now();
            const totalDash = 427;

            function updateCounter(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / duration);
                // Ease out cubic
                const eased = 1 - Math.pow(1 - progress, 3);
                const currentVal = Math.round(eased * 100);

                if (glassPercentText) glassPercentText.textContent = `${currentVal}%`;
                if (glassProgressBar) glassProgressBar.style.width = `${currentVal}%`;
                if (glassProgressCircle) {
                    const offset = totalDash - (totalDash * (currentVal / 100));
                    glassProgressCircle.style.strokeDashoffset = offset;
                }

                // Dynamic Status labels
                if (glassStatusLabel) {
                    if (currentVal < 25) {
                        glassStatusLabel.textContent = 'INITIALIZING SYSTEM...';
                    } else if (currentVal < 60) {
                        glassStatusLabel.textContent = 'LOADING 3D CORE...';
                    } else if (currentVal < 88) {
                        glassStatusLabel.textContent = 'STARTING AUDIO ENGINE...';
                    } else if (currentVal < 100) {
                        glassStatusLabel.textContent = 'PREPARING SHOWCASE...';
                    } else {
                        glassStatusLabel.textContent = 'EXPERIENCE READY ✦';
                    }
                }

                if (progress < 1) {
                    requestAnimationFrame(updateCounter);
                } else {
                    // 100% Reached!
                    // Celebratory hold then beautiful removal ("eka lassnata remove wenna one")
                    setTimeout(() => {
                        // Fade & scale out the center HUD
                        glassCenterHUD.classList.remove('show');
                        glassCenterHUD.classList.add('completed');

                        // 4 glass panels slide apart / remove beautifully
                        glassTransitionOverlay.classList.remove('closing');
                        glassTransitionOverlay.classList.add('opening');

                        setTimeout(() => {
                            if (typeof onComplete === 'function') {
                                onComplete();
                            }
                        }, 650);
                    }, 250);
                }
            }

            // Start counter
            setTimeout(() => {
                requestAnimationFrame(updateCounter);
            }, 250);
        }

        if (btnLetsGo) {
            btnLetsGo.addEventListener('click', (e) => {
                e.preventDefault();
                runGlassTransition(() => {
                    window.location.href = 'INDEX.HTML?enter=1';
                });
            });
        }
    </script>
</body>
